version: 5.2
common:
  train_log_path: BPIC15_1.csv.gz
  process_model_path: BPIC15_1.bpmn
  num_final_evaluations: 1
  clean_intermediate_files: false
  log_ids:
    case: case:concept:name
    activity: concept:name
    resource: org:resource
    start_time: start_timestamp
    end_time: time:timestamp
    enabled_time: enabled_time
preprocessing:
  multitasking: false
  enable_time_concurrency_threshold: 0.5
  concurrency_df: 0.75
  concurrency_l2l: 0.9
  concurrency_l1l: 0.9
case_arrival:
  num_iterations: 1
  num_evaluations_per_iteration: 3
control_flow:
  num_iterations: 1
  num_evaluations_per_iteration: 3
resource_model:
  num_iterations: 1
  num_evaluations_per_iteration: 3
extraneous_activity_delays:
  num_iterations: 1
  num_evaluations_per_iteration: 3
